name: Unity CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.6.7f1

jobs:
  merge-check:
    name: Merge into main cleanly
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Try merging base into PR
        run: |
          git config user.email ci@example.com
          git config user.name ci
          git merge --no-commit --no-ff origin/${{ github.base_ref }}
      - name: Fail on conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.md'; then
            echo "Conflict markers found"; exit 1
          fi

  tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    # Needs UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD secrets (see GameCI docs).
    # Skipped until the license secret exists so CI does not fail red on day 1.
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
